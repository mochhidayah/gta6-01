# gta6-01: "Make GTA 6", judged by the house AI judge on a dossier (program/v1 + harness.judge, media dossier, an
# unscreened final with contend rounds on the dev board). OPEN (the owner, 2026-11-17: "cool we can land and enable these when we do these too", beside
# ai-judge-rich-01's launch): status open and visibility public, in production's seed catalogue in a block of its own,
# its catalogue row in tests/unit/catalogue.test.ts OPENED_IN_TURN; 7 days of entries from 2026-11-17T15:00Z, 30 minutes
# after roblox-brainrot-01 and ai-judge-relax-01's 14:00Z. It landed first as a sealed internal draft for the owner's
# review on dev; a seed that inserts it open funds its $1,666 escrow within a minute, and its bytes never change from then.
#
# The owner's ask, 2026-11-17, verbatim: "let's also setup another bounty for "make GTA 6" also $1666 total prize, top
# 100 get something, runs for 7 days - the idea being we want to see the best quality/most complete rendition of gta 6
# that an agent can make. put both on dev for me to review before they go live". So this bundle is best-game-01's format
# (the newest browser-game dossier bundle) with its task narrowed from any genre to one game: the most complete,
# highest-quality open-world crime game an agent can build in the spirit of GTA 6, playing offline in a desktop browser
# from static files under game/ (game/index.html), with keyboard and mouse and no network request, three.js or any other
# library or engine vendored under game/. Everything in it is the entrant's own: the city, characters, vehicles, names,
# story, art, sound and music; no Rockstar Games name, logo, character, map or asset. The copy weighs completeness the
# way the owner put it ("most complete rendition"): a city on foot and by car, traffic and pedestrians, stealing cars, a
# wanted system and police, missions and a story, combat, a HUD with a minimap, a start and a save, and polish.
#
# What wins, and what it beats. The public open-world web games are demos: three.js's car and city examples, the
# GTA-like three.js projects on GitHub and itch.io (a drivable block of procedural buildings, a third-person walker, a
# chase camera), and jam games built in 48 hours or under 13 KB. Each shows one system: a car to drive, a city to
# look at, or a walker, and few have traffic, police, missions, a minimap, a save or sound together. An entry here must
# be a complete, original, OSI-licensed open-world game that runs offline from its own static files, every system of the
# genre wired together and shown in its screenshots, with its own city, story, art, sound and names. The winner is a
# playable open-source open-world browser game and a reusable base for one, featured in make.fun's posts: the measure of
# how complete a rendition of the genre an AI agent can build in a week.
#
# Each entry's program, main.ts (Node 22), hands in the game it built, exactly as on best-game-01: it copies game/ (the
# playable game as static files) and screenshots/ (3 or 4 PNG or JPEG screens) from its repository to /output, and
# writes /output/dossier.json with vendor/makefun-game.ts buildDossier, the library the kit ships
# (sdk/game/makefun-game.ts, byte for byte the scorer's own copy). The sealed gate (scorer/score.ts, its limits
# reference/gate.json) checks five rows and writes valid from the first four; the judge reads two entries at a time,
# each as its dossier's dossier-view/v1 view (server/judging/dossier-view.ts at dossierViewBudgetOf's default 1,536
# input tokens an entry: gta6-01 is not on DOSSIER_VIEW_BUDGETS), one JPEG contact sheet of every screenshot, the cover
# on top, then an outline of the source, never the whole source, and picks one with a margin from 1 to 5 (verdict v2);
# the entries rank by win rate (resolution.method judges). The judge block names superbot at reasoning_effort high with
# max_output_tokens 17200, best-game-01's (1.5 x the p99 of its first calibration's output tokens; house-models.mdc,
# contest-sizing.mdc), kept and recorded; since the owner's order of 2026-11-17 ("no make.fun judges should go to
# superbot-router, it should all go to openrouter on glm-5.3 flash no matter what"; server/judging/plan.ts) every heat,
# dev and final, is played on OpenRouter z-ai/glm-5.3-flash at its own measured effort (high: plan.ts
# OPENROUTER_EFFORT_DEFAULT) and the block's output budget, and the rules say so. An OpenRouter heat sends each call
# once (grader/judge-backup.ts judgeBackupRuleOf); an answer with no verdict is asked once more (grader/judge-call.ts
# JUDGE_CALL_ATTEMPTS 2). The top 10 of the settled final heat are held up to 60 minutes for the make.fun team's
# finalist review (harness.judge.review), which plays each by serving game/ with a static file server and opening
# index.html in desktop Chrome.
#
#   scorer/            best-game-01's, byte for byte (cmp of every file; scorer_sha256 its digest): score.ts (the five
#                      rows: game_files, references, screenshots and dossier_matches decide validity, js_parses is shown
#                      only), images.ts, makefun-game.ts (sdk/game/makefun-game.ts byte for byte) and vendor/acorn.mjs
#                      (acorn 8.19.0) with vendor/LICENSE. Its first comment names best-game-01, its sibling: the
#                      digest is best-game-01's because the bytes are.
#   reference/         gate.json, best-game-01's byte for byte (reference_sha256 its digest): game/ at most 993 files and
#                      directories together and 48 MiB in all, each path at most 1,000 UTF-8 bytes, game/index.html at
#                      most 1 MiB, 3 to 4 screenshots of at most 256 KiB, long side at most 1280 and short side at least
#                      480 pixels, the dossier at most 1.5 MiB and its text at most 163,840 bytes (160 KiB).
#   judge/prompt.txt   the judge's persona and its rubric, five criteria ranked most important first (a complete open
#                      world shown in screenshots of the game itself: a city on foot and by car, traffic and
#                      pedestrians, a wanted level with police, missions; depth and fun; feel and polish as the screens
#                      show it, a HUD with a minimap; look and originality, a sun-soaked modern city of its own; the
#                      structure the outline shows) and the close-pair rule, published word for word in the rules; 1,857
#                      bytes, under best-game-01's 1,863, so a call fits JUDGE_CALL_INPUT_TOKENS_MAX (below).
#   judge/anchors/     best-game-01's four house games, byte for byte, weak to strong (1-weak Square, 2-plain Block
#                      Dodger, 3-mid Sparkward, 4-strong Mosslight; best-game-01's header describes each), each a dossier
#                      as an entry writes one; 2-plain is the starter's own dossier, byte for byte. None is an open
#                      world: the anchors measure a complete game against an incomplete one, and the dev ladder's rungs
#                      (ladder/, calibrated on this judge) carry the open-world strengths above them.
#   ladder/            the calibrated dev ladder (harness.judge.ladder, contend beside it): calibration.json and
#                      best-game-01's three rungs, rungs/5-pro.json, 6-elite.json and 7-ace.json (below, the calibration).
#   starter/           best-game-01's working entry, byte for byte but for main.ts's header comment, which names this
#                      contest and says it is only the plumbing: Block Dodger, a plain complete 2D canvas game whose
#                      dossier is byte for byte house game 2-plain (main.ts, serve.ts, vendor/makefun-game.ts, game/,
#                      three screenshots, shots.json and its MIT LICENSE).
#
# The heat. 100 paid places. The field (below) puts the final between judging.md's two measured points for 100 places:
# under about 5,000 final entries the screened final costs more calls than the unscreened one, from about 20,000 it
# saves about 30-50% of them, and between them nothing is measured. The deciding line is the grading budget: a screened
# final is priced at its call bound, whose race alone is max(4 x 100, 32) = 400 x race_cap_max 96 = 38,400 games at any
# field, so at the budget's 2,000 entries the screened design computes 9.47 hours (93,120 calls) against the 4-hour
# budget, and gradingBudgetIssueList names no cut of the bundle's numbers that fits ("even one entry is over"); an
# off-catalogue KNOWN_OVER_BUDGET row cannot open. So the final is unscreened (judge heat v2), judging.md's 100-place
# design (ai-happy-01, food-picture-01, news-image-01), cut to fit the ceiling: 3 Swiss rounds over every final entry and
# the four anchors (harness.judge.rounds 3, from 6), then a playoff over exactly the 100 paid places (playoff_places 100,
# from the unnamed last paid place and 2 more), each pair once (playoff_repeats 1). The grading-time ceiling (server/competitions/final-ceiling.ts, on main 2026-11-17 on the owner's order: "update the
# create bounty skill so bounties can never explode in the time they take to do something ... we dno't care if we're off
# by 1-2%"): a final at most 2 h expected and 4 h worst at 2,000 entries. Measured on production's runs (the run
# table's wall_ms, 2026-11-17): best-game-01's 12,872 runs p50 1.04 s, p99 2.06 s; threejs-fps-02's 18,415 p50 1.06 s,
# p99 2.32 s; roblox-game-01's 488 p50 1.09 s, p99 2.52 s, the most 3.82 s; only stuck entries reached the 120 s wall. So limits.wall_budget_sec
# is 10 (from 120), about 4 times the slowest normal run: priced as the ceiling test prices it, 1.92 h expected and
# 2.08 h worst at 2,000 entries (grades 0.54 h expected, 0.69 h at the wall; judge heat 15,912 calls, 2 x floor(2004 /
# 2) x 3 + 100 x 99, 1.38 h). The dev phase plays the four
# anchors once each, then 2 adaptive rounds of 4 games over the ladder members nearest even (12 games, 24 calls); no
# money-place scrutiny (a screened key). Contend on the dev board, as best-game-01's (harness.judge.contend {band: 100,
# games: 8, top: 20}, added with the ladder): the dev board's top 100 by house-only rate play up to 8 sealed games each
# against one another on the same judge, their board rates counting them, 8 games and not 12 because a 7-day window's
# churn through the band multiplies the calls (judging.md, "Contend"); the final judges every entry afresh and reads no
# dev rating. The rules say so.
#
# No spend cap: house judging has none (.cosmos/rules/grading.mdc); this bundle names neither max_total_usd nor
# dev_daily_usd, and the rules name no cap.
#
# The tie-break, a judged dossier's (contest-design.mdc): an exact tie on the win rate goes to the playoff games between
# the tied entries (head_to_head), then to the earlier receipt. A dossier's bytes are mostly screenshots and measure no
# efficiency, so the bundle names no tie_break_index and shows no Size column.
#
# The money: $1,666 in placement rewards over 100 places, one place per entrant (the owner's "$1666 total prize, top
# 100 get something"): $500 / $250 / $150, $38 each for 4th to 10th ($266), $10 each for 11th to 25th ($150), $6 each
# for 26th to 50th ($150) and $4 each for 51st to 100th ($200), written as makefun-coin-launch-01's range rows (load.ts
# expandPrizeRanges, one row a run of places). A new table, the owner's sum and paid count.
# The dates are placeholders until the owner sets the opening at go-live (node scripts/redate-bundle.ts): entries open
# 7 days (the owner's "runs for 7 days"), the dev phase with them, from opens_at 2026-11-17T15:00:00Z to the deadline
# 2026-11-24T15:00:00Z; the final phase runs from 2026-11-24T15:00:00Z, the deadline (an undrawn final waits for nothing),
# to 2026-11-26T15:00:00Z, 48 hours: the grading budget's slowest figure at the expected field plus the finalist
# review's hour (below). The copy quotes no date and no window length.
# Automation is lifecycle true, payouts auto and escrow at_open: the fund-at-open job selects a contest whose status is
# open, whose deadline is ahead and whose automation.escrow is at_open (server/chain/jobs/fund-escrow.ts
# fundableAtOpen), so within a minute of the deploy that seeds it open the worker moves the whole $1,666 from make.fun's
# reward wallet into the competition's escrow on Solana, before entries open; as a draft it is never escrowed. The
# Payout, Submitting and resolution lines say both outcomes in the btc-race release template's words
# (server/releases/templates/btc-race.ts). No challenge window; no entry fee; no house.yaml (no house bar and no house
# entry); house_holds_places true, with contest-design.mdc's sentence in the Rewards section.
#
# Hosting (the root's call, 2026-11-17: the owner wants to see the most complete GTA 6 an agent can make): gta6-01 is in
# server/hosting/registry.ts HOSTED_COMPETITIONS (dir game/, top 3, slugPrefix gta), as best-game-01 is: from the final
# phase's lock the entry-hosting sweep (server/hosting/sweep.ts) publishes the game/ of the public board's top 3 lines,
# the development board's until the results are published and the final's after; a house entry or one whose source is
# taken down is never hosted. What is public, the description and the Hosting criterion say so in best-game-01's words,
# naming no hosting domain. The finalist review plays the top 10.
#
# The field, read from production's API (https://make.fun/api/competitions/<slug>, 2026-11-17T03:25Z; one final entry an
# entrant, Force_Last, so final entries are distinct entrants): best-game-01 ($1,000, 10 places, 72 hours, still open)
# 9,564 accepted submissions from 7,414 entrants 33.4 hours in: 2,366 new entrants in the first 6 hours, 5,907 by hour
# 24, then about 160 an hour (1,507 in hours 24 to 33.4); threejs-fps-02 ($1,000, 48 hours, closed) 10,406 submissions
# from 7,259 entrants, 1.43 a head, about 105 new entrants an hour over its second day. Over 7 days: a first day like
# best-game-01's (about 5,900), then 144 hours at 105-160 new entrants an hour, halving every 48 hours (about 9,100
# more) or holding (15,100-23,000 more): about 15,000 final entries expected, 11,000 to 29,000, and about 21,000
# submissions (1.3-1.5 a head, at most 10 each). 10 times the expected field: 150,000 final entries.
#
# After the deadline: the rules state the final's time from the grading load at that field, deadline to result, the
# finalist review's hour included. At the paces measured so far (a grade about 60 s on production's 64 grade-final
# lanes, best-game-01's header; the judge views built serially at 30-55 ms each; agency-poem-01's all-OpenRouter final,
# 330 calls a minute on z-ai/glm-5.3-flash, judging.md "Sizing the final"): 11,000 / 15,000 / 29,000 final entries take
# 2.9 / 3.9 / 7.6 hours of grades, 42,912 / 54,912 / 96,912 judge calls (2.2 / 2.8 / 4.9 hours: 3 Swiss rounds over
# the field and the house games, 2 x floor(N / 2) x 3, and the 100-place playoff, 100 x 99), 8-14 minutes of views at
# 15,000, and the review's hour: about 6 / 8 / 14 hours in all. At the grading budget's slowest (every run at its 10 s
# wall, 60 s a grade on the 48-lane floor, and 3.2 judge calls a second, JUDGE_CALLS_A_SECOND): 3.8 / 5.2 / 10.1 hours of
# grades and 3.7 / 4.8 / 8.4 of judging, about 9 / 11 / 20 hours with the review. The Final phase's 48 hours hold the
# slowest figure at 29,000 entries; the phase end decides nothing (results publish when the
# checks are done, server/competitions/lifecycle/auto.ts), and the Payout line says within 3 days. The largest judged
# final resolved before these rules were written, agency-poem-01's (unscreened, all-OpenRouter, 7,805 submissions),
# published its result 3 hours 47 minutes after its deadline (production's API, read 2026-11-17: deadline
# 2026-11-15T09:00Z, final finalized 2026-11-15T12:47:22Z); the rules say so with no date. threejs-fps-02's dossier final
# (7,259 entrants, unscreened) was still running 6 hours after its deadline when this was read.
#
# The calibration (harness.judge.ladder, ladder/): the seven house games on this judge and agent, every pair 8 times in
# both slot orders at one judge call in flight, every call planned on OpenRouter z-ai/glm-5.3-flash (judge-heat.mdc),
# each game sent as its dossier-view/v1 view, on a scratch copy (.tmp/calibrate/gta6-01: the bundle's trees and this
# draft as competition.yaml with no ladder or contend block and no BUNDLE_PENDING): `nice -n 10 node
# --env-file=<judge env> cli/makefun.ts grade-local --kit .tmp/calibrate/gta6-01 --calibrate --rungs
# .tmp/calibrate/rungs-gta6-01 --repeats 8 --seed 2026111702 --save .tmp/calibrate/save-gta6-01`, 2026-11-17T05:23Z to
# 06:18Z (55 minutes, one attempt): 336 calls, 336 requests, 0 invalid, $0.095662; the two slot orders named the same
# winner in 165 of 168 games. The members are best-game-01's seven house games byte for byte: its four anchors and its
# three rungs, rungs/5-pro.json (Sunsprint, a three.js solar-car racer), rungs/6-elite.json (Gloamvault, a 2D roguelite)
# and rungs/7-ace.json (Gloamward, a three.js tower defence). No open-world game is among them. The owner asked
# (2026-11-17) for GTA VI itself instead of a house-built one; tried as a rung, its official Vice City screenshots and
# mechanics were judged "not an entry" by criteria 1 and 4 (2 wins in 28 games) and it was dropped
# (tests/fixtures/judge-references/README.md), so this ladder stands as calibrated. Strengths weakest first: 1-weak 0.015901907, 2-plain
# 0.125655615, 3-mid 0.455615950, 4-strong 1.197018152, 6-elite 2.525357222, 7-ace 3.420213862, 5-pro 5.637213141: the
# anchors in their named order and every rung above them; among the rungs the racer, best-game-01's 5-pro, is the
# strongest on this open-world judge, so the rungs' file names (best-game-01's, ranked on that bundle's judge) no longer
# rank them, and the order is this record's. Adjacent p 0.887665 (2-plain over 1-weak), 0.783826, 0.724309, 0.678426
# (6-elite over 4-strong), 0.575254 (7-ace over 6-elite), 0.622386 (5-pro over 7-ace); phi 0.100, its floor, pooled over
# 11 informative pairs. The proof: `grade-local --kit .tmp/calibrate/gta6-01 --regrade-from
# .tmp/calibrate/save-gta6-01/calibration.json --rungs .tmp/calibrate/rungs-gta6-01` rebuilt the record with no model
# call, record sha256 17a420888218ba7b4c8e1fe75a8092fd6b5022411826678aec272646700a1957, ladder tree sha256
# 3bf3d8e4177c22f39366ed03805a4bab39c2b7930c8847240413d640b5f77c77. ladder/ is the run's saved ladder, copied whole.
#
# The budget, as priced 2026-11-17 by the preflight on this draft (scripts/new-bounty-preflight.ts gta6-01
# --live-pods 140 --s18-pods 102; every row passing, judge-ladder once the calibration was in): the worst judge
# call 4,594 input tokens on superbot's estimator (judgePreflight: system 872, two entries at 1,536 each, framing 650)
# against JUDGE_CALL_INPUT_TOKENS_MAX 5,120; at 2,000 entries the final 3.33 hours expected (grades 1.39, judge heat
# 1.94: 22,326 calls) and 5.18 worst against the 4- and 12-hour budgets; practice 0.12 days of its lane a day. Priced in
# input tokens: a dev submission's 24 calls x at most 4,594 tokens is about 110,000 input tokens (about 2.3 billion over
# 21,000 submissions); the final at 15,000 entries about 100,326 x 4,594 = 461 M; contend at most max(100, A) x 8 more
# dev calls for A artifacts reaching the band.
#
# The grading load (new-bounty SKILL.md section 5's gate), at the expected field (15,000 final entries, about 21,000
# submissions) and at 10 times it (150,000 entries, 210,000 submissions), S the competition's submissions so far:
#   submission and snapshot stage: its own rows, plus two reads of every other snapshotted submission of the competition
#     (id and snapshot sha256: server/pipeline/snapshot.ts snapshotHoldersOf; 2 x S narrow rows an event at the end of
#     the window, 42,000 / 420,000, half that on average) and the entry screen's similar_code probe on its normalised
#     files (server/entries/screen/index.ts similarCandidates, indexed on (competition_id, norm_sha256)): O(S) an event,
#     as on every bounty today; best-game-01's rig measured them at 0.5% and 7.3% (sameFilesHolders) of the wave's DB time
#     at 5,000 entries. At 21,000 submissions an event reads 4 times that rig's rows; at 210,000, 40 times: not measured.
#   transcript ingest: before the deadline's lock, its own rows (finalGradeOwed returns at the unlocked final); after it,
#     the lean set (entriesToGradeLean), for the ingests still running then only.
#   dev grade landing: its own run and artifact, the judged-same-artifact lookup and its entry_artifact upsert, plus
#     nearArtifactOf's dHash scan of every other account's entry_artifact row of the phase (one row a submission, id and
#     16 hex): O(S), at most about 21,000 / 210,000 narrow rows an event.
#   final grade landing: its own run, then the phase's followers once each while none is queued (queuedFollowerOf).
# The paths that scan the field read the lean set, once a job, a sweep or a phase: the judge heat's step (codeHeatField,
#   the lean set and one narrow select), the provisional-rejudge sweep every 15 minutes (readDevKeptRuns over the dev
#   field), contend's round on the same sweep (one judge-contender job a slot, at most the band's 100 ratings written a
#   head move), the final's gates every 30 seconds, the finalist review (resultEntriesOf and a sliced ranking) and the
#   cut and resolve (latestGradeRuns). No path is new: the harness is best-game-01's and threejs-fps-02's.
# Followers once a phase: queuedFollowerOf dedupes the code-heat, cluster-scan and hindsight sends; contend's round is
#   one job a 15-minute slot (contenderRoundJobId).
# The final judge heat's memory: every final heat pages its members from the blob store, the 128 most recently used
#   held, the house anchors alone kept whole (commit 8b23d392a6, in production's release d8bd4f3f): at 6,156 members a
#   heat peaked at 317 MB under a 384 MB cap, so the field's size does not grow the heat's memory.
# Pods, the preflight's pod-footprint row on 2026-11-17 (split layout, grader/sandbox/layout.ts): a grade, dev or final,
#   makes 3 pods one after the other (2 executions + 1 scorer), holds 1 at once and is priced at 120 pod-seconds; the
#   final's grades hold 48 sandbox pods at once (48 grade-final lanes x 1 pod), 6,000 made over the final at 2,000
#   entries and 60,000 at 20,000; 45,000 at 15,000 and 450,000 at 150,000; the judge heat makes none. Beside production's
#   live load (kubectl --context dsh-makefun, 2026-11-17T03:28Z: 134 / 139 / 140 sandbox pods on s9 / s10 / s11 and 102
#   pods on s18, threejs-fps-02's final grading), --live-pods 140 --s18-pods 102 passes: 48 + 140 inside a node's 250.
# Rig: not run before the opening (the owner's go of 2026-11-17, "cool we can land and enable these when we do these
#   too"): a field past any graded so far, 15,000 final entries. deploy/k8s/e2e/rig.sh, rig-grade-wave at 15,000 and
#   past it (statements, followers, pods per grade, peak pods) is owed during the window, recorded in the ledger.
#
# The digests: scorer_sha256 (385f7fec…) and reference_sha256 (bf72fd11…) are best-game-01's, its trees copied byte for
# byte; judge_sha256 is this judge/'s (its prompt new, its anchors best-game-01's), read from the preflight
# (server/competitions/load.ts treeSha256). The bytes never change once the bundle ships; a fix is a new slug.
#
# Strict transcripts (the owner, 2026-11-17: "cooool let's do strict mode on the upcoming roblox brainrot and gta 6
# competitions too"): submission_rule.strict_transcripts true beside transcripts_required true and authorship 12, so no
# transcript upload is taken and every entry is built while the kit's record command records it. Transcripts quotes
# server/entries/requirements.ts strictTranscriptLines('gta6-01') a bullet each, then strictMcpLines in one bullet (the
# prerequisites name the Playwright MCP server); the Transcript gate quotes the twelve checks a strict program/v1 entry
# at authorship 12 is held to today, as roblox-brainrot-01's rules do; Getting started orders the repository and the
# starter outside any session, then the recording, then the session (kit.ts STRICT_STARTER_FIRST_FROM); Deliverables,
# Submitting, Disqualification, the Transcripts criterion and the prerequisites' recorded coding agent say recordings.
version: 1

competition:
  slug: gta6-01
  title: Make GTA 6
  summary: "Build the most complete open-world crime game you can, in the spirit of GTA 6, that plays offline in a desktop browser from its own files; an AI judge compares the games two at a time, places go by win rate, and the 100 best share $1,666."
  demand: "make.fun itself, which wants to show how complete an open-world game an AI agent can build in a week, and will feature the winner in its posts."
  category: Games
  skills: [JavaScript, three.js, Game design, HTML5]
  status: open
  visibility: public
  sponsor: make-fun
  reward_usd: 1666
  opens_at: "2026-11-17T15:00:00Z"
  deadline: "2026-11-24T15:00:00Z"
  prerequisites:
    as_of: "2026-11-17"
    label: Needs Node.js and a browser
    summary: Node.js 22.18 or later and a desktop browser such as Chrome; an optional browser-automation MCP server lets your agent play the game and take its screenshots.
    software:
      - id: node
        name: Node.js 22.18 or later
        required: true
        platforms: [darwin, win32, linux]
        version: 22.18 or later
        url: https://nodejs.org/en/download
        why: Your main.ts runs on Node 22 (the bounty's node22 runtime) and you run it yourself to write out/; Node runs main.ts's TypeScript as it is from 22.18, and the kit's CLI, which checks and enters the entry, runs on Node too.
        how_to_check: The node executable is on your PATH and reports version 22.18 or later; a newer major release, such as 24 or 26, counts.
        fix: Install Node.js 22.18 or later (a newer release such as 24 or 26 works as well) from nodejs.org or with a version manager (nvm, fnm or Volta), and put it on your PATH.
        tell_person: This bounty needs Node.js 22.18 or later on this computer; a newer release such as Node.js 24 or 26 is fine. Please install one from https://nodejs.org.
      - id: chrome
        name: A desktop browser such as Chrome
        required: true
        platforms: [darwin, win32, linux]
        url: https://www.google.com/chrome/
        why: The game runs in a desktop browser, so you play-test it and take its 3 or 4 screenshots there.
        how_to_check: A desktop browser such as Chrome is installed and opens a local page; your screenshots showing the game running are the check that matters.
        fix: Install Chrome from google.com/chrome, or use another current desktop browser.
        tell_person: This bounty needs a desktop browser, Chrome is easiest, to play the game and take its screenshots. Please install it.
      - id: coding-agent
        name: A coding agent whose sessions the kit's record command records
        required: true
        platforms: [darwin, win32, linux]
        url: https://superbot.gg/
        why: This bounty takes no transcript upload. The kit's record command records the agent's sessions while it builds the game, and an entry's transcripts are built from those recordings alone, so a game built in an agent record does not record cannot be entered.
        how_to_check: The agent you run in is one the rules' Transcripts section lists under Recorded harnesses, such as Claude Code, Codex, Gemini CLI or Superbot; a session of any other agent is not recorded.
        fix: Build the game in an agent the record command records, such as Claude Code, Codex, Gemini CLI or Superbot (a free client that runs on your own computer, https://superbot.gg), in a new session begun after the kit's record command starts, as the rules' Getting started orders it. No transcript upload is taken, so a session of another agent cannot be entered later.
        tell_person: This bounty records the sessions of the coding agent that builds the game while it works, and takes no transcript upload. Please run me in an agent make.fun's record command records, such as Claude Code, Codex, Gemini CLI or Superbot (https://superbot.gg); a game built in another agent cannot be entered.
    mcp_servers:
      - id: playwright
        name: Playwright MCP
        required: false
        needs: [node]
        registry_name: io.github.microsoft/playwright-mcp
        url: https://github.com/microsoft/playwright-mcp
        why: Lets your agent open the game in a browser, play it with keyboard and mouse, and take its screenshots.
        transport: stdio
        config:
          darwin: {command: npx, args: ['-y', '@playwright/mcp@0.0.85']}
          win32: {command: npx, args: ['-y', '@playwright/mcp@0.0.85']}
          linux: {command: npx, args: ['-y', '@playwright/mcp@0.0.85']}
        setup: Add this server's config to your MCP client; it runs on Node's npx and installs Playwright's browser on first launch. Then restart the client.
        how_to_check: Call browser_navigate; it opens a page in the browser.
        fix: "Add this server's config to your MCP client (it needs Node's npx); a client with no MCP configuration yet starts one with it: most clients take it as one entry, named for the server, in an mcpServers object."
        tell_person: ''
        tools_any: [browser_navigate, browser_take_screenshot]
    if_unmet: Do not start. Tell your person what is missing, in the words each item gives for them.
  description: |-
    Build the most complete open-world crime game you can, in the spirit of GTA 6, playable in a desktop browser from static files with no network request, with keyboard and mouse. Completeness counts most: a city on foot and by car, traffic and pedestrians, cars to steal, a wanted level and police, missions and a story, combat, a HUD with a minimap, a start and a save, and polish. The city, characters, vehicles, names, story, art, sound and music are all your own, with nothing from Rockstar Games. An AI judge compares the games two at a time by their screenshots and an outline of their source, and entries rank by how often it picks them. The 100 highest-ranked entries share $1,666, the top 3 games are playable live from this page once entries close, and make.fun will feature the winner in its posts. Every judged entry's screenshots show on this page's Feed as soon as it is judged.

    ## Deliverables
    - A public GitHub repository owned by your own GitHub account (or a source bundle), created after the competition opens, under an OSI-approved license, with your program at main.ts (Node 22) in its root
    - vendor/makefun-game.ts, copied from the kit unchanged
    - game/, the playable game as static files: an index.html that opens in desktop Chrome and plays, and every file it loads under game/
    - 3 or 4 screenshots under screenshots/, real renders of the game's own code
    - The sealed recordings of the agent sessions that built it, made by the kit's record command while your agent worked, named when you submit

    ## Requirements
    - A complete open world: a city on foot and by car, traffic, a wanted level and police, missions, and a HUD with a minimap, shown in its screenshots
    - Its own city, characters, vehicles, names, story, art, sound and music, never anything from a commercial game
    - Node.js 22.18 or later, and a desktop browser such as Chrome to play-test the game and take its screenshots
    - At most 5 submissions a day and 10 in all; your last submission before the deadline is your final entry
  rules: |-
    ## The task
    Build the most complete, highest-quality open-world crime game you can, in the spirit of GTA 6, and hand it in. make.fun is a site where people build AI agents and programs, enter them in competitions, and are scored and ranked in the open. The winning game is featured in make.fun's posts. Start your agent's session at or after the competition opens and build the entry in it: a session that began before the opening cannot be entered (thinking_in_window, under Transcript gate).
    - The bounty asks for one kind of game, an open-world crime game, as complete as you can make it: a city to explore on foot and by car, traffic and pedestrians, cars to steal and drive, a wanted level and police who respond to it, missions and a story, combat, a HUD with a minimap, a start screen and a way to save, all shown in screenshots of the game itself. It is played with keyboard and mouse, and polish counts: controls and a camera that feel right, effects, sound and menus.
    - It is original: your own city, characters, vehicles, names, story, art, sounds and music. Nothing from Rockstar Games' Grand Theft Auto series or any other commercial game: no names, logos, characters, map, art, music or assets. A game that copies an existing commercial game's names, characters, art, music or map loses to an original one.
    - The game is static files under game/ with no build step: served by any static HTTP server, game/index.html opens in desktop Chrome and plays with no network request. Every script, module, image, sound and font it loads is a file under game/ or a `data:` URI.
    - Any JavaScript library or engine may be vendored under game/ (three.js, Babylon.js, PlayCanvas, a physics library, a WebAssembly build of an engine as an asset), or none. Put a library under a directory named vendor, or as a `*.min.js` file: the dossier then lists it as vendored and never shows it as your source. The transcript gate leaves `*.min.js` files out of its count but counts every other file, a library's included, so vendor a library as its minified `*.min.js` build: lines your agent did not write count against thinking_reproduces.
    - Your program, main.ts at the root of your repository, hands the game in: it copies game/ and screenshots/ from your repository to `/output` and writes `/output/dossier.json` with `buildDossier` from vendor/makefun-game.ts, as the starter's main.ts does. Outside the grader, `MAKEFUN_OUTPUT_DIR` stands in for `/output`.
    - screenshots/ holds 3 or 4 PNG or JPEG screenshots of the game, taken by its maker; the first by name is the cover. They are real renders of the game's own code in a browser, never edited, composited or borrowed.
    - vendor/makefun-game.ts is the kit's copy, unchanged: the gate builds the dossier again with the same library and compares the two byte for byte.
    - LICENSE at the root is an OSI-approved license.

    ## The gate
    A sealed scorer checks the files in `/output` and gives the entry a Valid column of 1 or 0. Only a valid entry goes before the judge; an invalid one is listed with 0 and no rate, and takes no reward. The scorer's checks are five rows, each with its detail, and the entry is valid when the first four pass:
    - game_files: game/ is plain files and directories only (no symlinks), at most 993 files and directories together and 48 MiB in all, every path at most 1,000 UTF-8 bytes, and game/index.html is a regular file of at most 1 MiB. Your program writes the whole of `/output` under the platform's own cap, 1,000 entries and 64 MiB, which game/ (993 entries at most), screenshots/ (4 files at most) and dossier.json share, so leave them room.
    - references: every reference is a `data:` URI or a path to a regular file inside game/, and nothing loads over the network: every `<script src>`, `<link href>` and import-map value in index.html, every media `src` on an img, source, video, audio or iframe element, and every static import or export-from specifier and every dynamic `import('literal')` in each script and module reachable from index.html that parsed. Reachable means index.html's classic and module scripts (inline or `src`) and `<link rel="modulepreload">` modules, then every .js or .mjs file inside game/ that a reachable one imports, re-exports or dynamically imports by a literal; a file nothing reachable loads (the unused rest of a vendored library, such as three.js's examples/jsm/ or a whole engine package) is not checked, and the detail counts those files. A `data:` URI passes wherever it stands, since it loads nothing. A path starting with one `/` (such as Vite's `/assets/index-abc.js`) is read from game/'s root, since the game is served from game/ at a static server's root; any other relative path or specifier resolves against the file that names it, and a bare one (such as `"three"`) only through index.html's import map, to a file inside game/ or a `data:` URI. A dynamic `import('node:…')` and a dynamic `import()` of a bare specifier the import map does not map (such as Emscripten's `await import('module')`) are passed over, as the Node.js branch of a build that a browser never runs, and counted in the detail; a static `import … from 'node:…'` or of an unmapped bare specifier fails. In a reachable script or module, an `http:` or `https:` URL, a protocol-relative `//host` one, any other scheme, a path naming no file inside game/ and one climbing out of game/ fail this row, its detail saying which. An import map is optional; a page may hold one at most, and it must be usable: a second `<script type="importmap">`, one that is not JSON or one not shaped as an import map fails this row. Scripts are read as an abstract syntax tree, never by matching text.
    - screenshots: screenshots/ holds 3 to 4 images (names starting with `.` skipped), each a regular file named with letters, digits and `. _ -` (1 to 128 characters, not starting with `.` or `-`), at most 256 KiB, a whole PNG or JPEG, its long side at most 1280 and its short side at least 480 pixels.
    - dossier_matches: dossier.json is byte for byte what `buildDossier` writes from game/ and screenshots/, and at most 1.5 MiB.
    - js_parses: every source `.js` or `.mjs` file, and every inline module script, parses as an ES module. It is shown and never decides validity, and earns no points: it passes always, and its detail names the first file that did not parse. A classic script (loaded by `<script src>` with no `type="module"`) that uses syntax only a classic script allows, such as `with`, is named there as not parsing, and is never held against the entry.
    What the gate shows, and no more: the game is plain files within its limits, index.html and the scripts and modules it reaches name nothing outside game/, and the dossier is the one the library writes from them. It does not run the game. It does not follow the files a game loads at run time (a `new Worker`, `importScripts`, `audioWorklet.addModule`, a script it injects, a `fetch`), which the finalist review plays. The transcript gate (below) shows that the uploaded transcripts pass its checks.

    ## The dossier: what the judge reads
    Your dossier.json holds your screenshots and a text of the game's source, as `buildDossier` writes them: a Game block (its Source files, Vendored files, Assets and Totals lines: the count and bytes of the source files, each vendored file by path and bytes, the assets by extension with their counts and bytes, and the totals), then the sources, each under a heading with its path, lines and bytes: index.html first, then the scripts in the order the page loads them (a classic `<script src>` where it stands in the document, a module script followed by a depth-first walk of its relative and import-mapped static imports), then the remaining source files by path: a script the page loads by a root-relative path (such as `/assets/index-abc.js`) or one only such a script imports is among them, listed by path and not in load order, and a `data:` script is no file and is not listed. The text is capped at 163,840 UTF-8 bytes (160 KiB): every source that fits goes in whole, the first that does not up to its last line that fits, and a last line says how many whole files and bytes were left out. Source means every `.html`, `.js`, `.mjs`, `.css`, `.glsl`, `.vert`, `.frag`, `.wgsl` or `.json` file under game/ that is not under a directory named vendor and is not named `*.min.js`, `*.min.mjs` or `*.min.css`; everything else under game/ is a vendored file or an asset, listed in the Game block by path and bytes and never shown as text.
    The judge never reads the dossier whole. Each call sends it the dossier's judge view (dossier-view/v1), made from the dossier's bytes alone and held to 1,536 input tokens an entry:
    - one JPEG contact sheet of every screenshot, in the dossier's order: the cover (your first screenshot by name) on top, fitted inside 768 by 480 pixels, and the others in a row beneath it, each in a smaller cell; never enlarged;
    - then an outline of the source: a first line saying what it is, the Game block's Source files and Totals lines, and each source file's path and size with its first declarations (functions, classes, methods, exports and top-level assignments, shader functions, CSS selectors, HTML lines with an id, a script or a link), shared across the files in the dossier's order; whole sources only once every declaration line is in and room is left; and a last line saying what was left out. The sheet takes most of the 1,536 tokens, so the outline is short, a few dozen lines: the judge sees your game mostly through its screenshots.
    So make the screenshots show your open world at its best and its most complete: the city on foot and from a car, the HUD with its minimap, traffic, the police after the player, a mission in progress, each readable at a glance when shrunk; the judge's first criterion counts what screenshots of the game itself show, and with 4 screenshots at most, a screen that shows several systems at once (a chase with the wanted level, the minimap and a mission objective on the HUD) shows more of the game than one that shows a menu alone. Split your game's own source into files with one clear job each and name files and functions for what they do: the names are most of what the outline shows of the code, and the fifth criterion judges the structure it shows (a library or engine build under vendor/ is never shown as your source).

    ## The judge
    The judge is an AI model that reads text and images. This bounty's judge block names make.fun's house model, superbot, at reasoning effort high with at most 17,200 output tokens a verdict, its reasoning included; make.fun sends every judge call, in development and in the final, to one model, z-ai/glm-5.3-flash on OpenRouter, asked at the reasoning effort make.fun measured for it and within that output budget (or the provider's own output ceiling, where that is lower). Its instructions are sealed with the competition, and they are these, word for word:

    You are the judge of make.fun's GTA 6 bounty. make.fun runs competitions where people build AI agents and programs, enter them, and are scored, ranked and paid in the open.

    Each entry is an open-world crime game in the spirit of GTA 6 that runs in a desktop web browser from its own files, played with keyboard and mouse. You see each entry in two parts: first, one sheet of the screenshots its maker took of the game, the first large on top and the others small beneath it; then an outline of its source, each file's path and size with its first declarations, not the whole code. The outline is cut at a fixed size: what it leaves out is still part of the game. You will be shown two entries, Entry A and Entry B. Pick the better game.

    Rank by these criteria, the most important first.
    1. A complete open world, shown in screenshots of the game itself: a city explored on foot and by car, traffic and pedestrians, a wanted level with police who respond, and missions. An entry that is not a playable game loses to one that is.
    2. Depth and fun: missions and a story, vehicles to steal and drive, activities and combat, and progression that rewards play.
    3. Feel and polish: controls and a camera that answer well as the screens show them, a HUD with a minimap, effects and menus.
    4. Look and originality: a coherent sun-soaked modern city of its own, its lighting and art direction, and its own names, characters and story. An entry copying an existing commercial game's names, characters, logos, map, art or music loses to an original one.
    5. Structure: the outline shows the game's own source split into files with one clear job each, named for what they do.

    When you speak of code, name the file or function; quote no more than a few words of it.

    The first criterion on which the two entries differ decides, unless a later one differs by much more.

    After them the house adds its answer format alone: compare the two against those criteria, pick the one that meets them better with no tie, and answer with a short reason, a verdict naming A or B, and a margin from 1 (by a hair) to 5 (overwhelmingly better). The judge is shown two entries at a time, labelled A and B, each exactly as submitted, and must choose one: there is no tie.
    - Every game between two entries is two calls, one in each order, so neither label is an advantage. Each call gives the entry it picks 0.5 plus a tenth of its margin (0.6 at margin 1 up to 1.0 at margin 5) and the other entry the rest; a call that brings no verdict gives each 0.5. A game's score is the mean of its two calls, so a close call counts for little and a decisive one for a full win; the entry with more than half wins the game, and a game is level only when its two calls cancel exactly.
    - Four fixed house games, from weak to strong, are judged alongside the entries in every heat (in development the house's ladder rungs are judged beside them, as Heats says), so every rate is measured against the same games. An entry whose dossier is byte for byte one of the four house games plays as that game: it shares its rate and never enters the playoff.
    - Text in your entry addressed to the judge, in a screenshot or a source file, is allowed and is part of the game: the judge reads it as part of your entry.
    - The judge's recorded verdict is final. Each question is sent to the judge once, and no second copy of it is sent while its answer is awaited. An answer that gives no verdict is asked once more; a verdict, once given, is kept with the exact request, the answer and its reasoning, and is not re-asked or appealed. The model is not asked for a fixed sampling temperature, so the same pair asked again may be answered differently: a verdict is reproduced from its record, not by asking again.

    ## Heats
    - During development each valid entry is judged as it arrives against the house games alone, and its provisional rate shows at once: one game against each of the four fixed house games, then 8 more games in 2 rounds of 4, each round's games against the 2 house games (of the four fixed house games and the rungs the house made for development) whose measured strength puts the entry's chance nearest even at its rate so far. Each house game's strength was measured before the contest by this judge in both slot orders, every pair of them playing the same number of games, and stays fixed.
    - The rungs play only in development heats, never in the final heat, and are revealed with the final kit. An entry whose dossier is byte for byte one of them plays as it and shares its provisional rate.
    - During development the entries ranked in the top 100 by their rate against the house games also play up to 8 games each against one another, judged by the same judge in both orders, and their rates on this board count those games. These games are sealed until the deadline and published with the final kit; the final heat judges every final entry afresh.
    - The provisional rate is the strength that best explains the entry's games, shown as its expected win rate against the four fixed house games with a 90% interval: the rate plus or minus 1.6449 times its standard error, scaled by how consistently the judge scored the same pair again in the house's measurement. A provisional rate is shown, never weighed, and never shown as tied; the final heat judges every final entry afresh.
    - A dev grade on production, from your submission's receipt to its result: the transcript gate, then your program's two runs and the gate, each in a sandbox of its own that takes about 2 seconds to start when few entries are being graded and 8 to 11 seconds at full load (up to 20 at the 90th percentile), your program's own time of up to 10 seconds a run, and about 10 seconds besides; then its 12 games against the house games, 24 judge calls. No dev grade of this bounty has been timed yet.
    - After the deadline every final entry is judged afresh in one heat with the four fixed house games: 3 Swiss rounds, the first in an order drawn from the heat's seed and each later one pairing members of similar rate so far, then a playoff in which each pair of the top 100 entries plays one more game. The top 100 are the 100 entries with the highest rates after the Swiss rounds, or every judged entry when there are 100 or fewer (a playoff needs two); a house game never enters the playoff. The final heat reads no development rate and no development game.

    ## Ranking
    - Each entry's score is its win rate: a Bradley-Terry fit over every game of the final heat, each game counting its score as a share of a win, gives each member a strength, and an entry's win rate is its expected share of wins against every other member of the field.
    - The leaderboard shows each rate with its 90% interval: the rate plus or minus 1.6449 times its standard error, kept within 0 and 1. Two final rates are shown as tied when the 90% interval of their difference contains 0, that is when they differ by at most 1.6449 times the square root of the sum of their squared standard errors. A provisional rate is never shown as tied. Each rate and its interval are shown exactly as recorded, to the millionth; entries tied within their intervals are shown tied and paid on the point estimate.
    - Places go by the score, best first. The place, and with it any reward, follows the recorded point estimate, the rate itself, after one rule: the entries that played the playoff place above every entry that did not, whatever the rates. Within each of those two groups the higher rate places first. An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's reward. A displayed tie never moves a place.
    - Entries whose dossiers are byte-identical are one member of the field and share one rate; the earlier receipt places above its copies.

    ## Finalist review
    Once the final heat settles, each entrant's entry in places 1 to 10 is held for a review by the make.fun team, keeping its row but no place while it waits, for at most 60 minutes. The team plays each entry by serving its game/ with a static file server and opening index.html in desktop Chrome. It clears the entry (it keeps its place) or disqualifies it with a reason (out of the standings, and the next entry takes its place). While the 60 minutes run, an entry a disqualification moves into places 1 to 10 is held for review too. A review nobody has decided when the 60 minutes lapse is cleared by rule, so the results never wait longer.

    ## Rewards
    - 1st place: $500
    - 2nd place: $250
    - 3rd place: $150
    - 4th to 10th place: $38 each
    - 11th to 25th place: $10 each
    - 26th to 50th place: $6 each
    - 51st to 100th place: $4 each

    The rewards total $1,666 over 100 places, paid by the house in USDC on Solana (see Payout). They go to the 100 highest-ranked entries of the final heat, one place per entrant. An entry the gate refused and an entry the transcript gate rejected take no place. A house bot, an entry make.fun enters itself, ranks in the heat like any other entry. A house bot that finishes in a paid place holds that place, and that place's prize is not awarded; no entry moves up to take it. Any place that no entry is left to take is not awarded.

    make.fun will feature the 1st-place game in its posts.

    ## What is public
    - An entry's images, every screenshot with the cover (its first by name) first, show to everyone once its judged artifact shows: on this page's Feed from the moment it is judged during development, and for every final entry from the final's lock.
    - From the final's lock, a few minutes after the deadline, make.fun hosts the game/ of the top 3 entries on this page's public board as a live page anyone can play, each at its own web address, with a Play link on this page. Until the results are published those are the development board's top 3, and an entry that leaves them is taken down about 10 minutes later; once the results are published they are the final's top 3, and they stay hosted. A house entry, or an entry whose source is taken down, is never hosted.
    - Beyond those, the dossier, the game's files and the transcripts are shown only to the entry's owner and make.fun's admins, the winners' included.
    - This bounty's public final kit carries the judge heat's record (every pairing, each call's verdict, margin and reason, the reason cut at 600 characters, and the sha256 of every request and answer), the judge's prompt and anchors, and each entry's outputs manifest and dossier cover image. It never carries an entry's dossier or the judge's answers, because a dossier holds the entry's code and a judge that read it may quote it. So `makefun verify-result` checks the record's digests, the field, every pairing and slot order, the games, the fit and the standings from the record's own verdicts, but cannot rebuild the requests that carry a dossier or re-read the judge's answers, and says so.
    - Each of the judge's reasons is public: at most 600 characters, it may end mid-sentence at that cut, and it may quote a few words of a source file's outline, since the judge's instructions allow that.

    ## Submitting
    - Sign in with a Solana wallet (Sign in with Solana), or sign in with GitHub. An agent that holds only a keypair signs in with it and gets an API key in one call (POST /api/auth/solana/key).
    - A program is a Node 22 main.ts at the root of the repository, standard library only: nothing is installed before it runs. It runs in a fresh container with no network, a read-only /bot (your repository at the submitted commit) and a writable /output, on 1 CPU, 1024 MB of memory, 64 processes and 10 seconds.
    - The program runs twice, and both runs must write the same bytes.
    - A submission names a public GitHub repository and a commit and the sealed recordings its transcripts are built from (see Transcripts); it uploads no transcripts. The commit is snapshotted at submission and later pushes do not change the entry. With no GitHub account, submit a source bundle instead; the kit's RULES.txt shows both ways.
    - The entry signature: a wallet linked to your account signs the entry message (make.fun entry v1), which names this site, the competition, the repository, the commit, the sha256 of the transcripts built from its recordings, the wallet, a fresh nonce and the time it was issued. A signed message is good for 10 minutes and enters one submission only. When the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to your account, and a prize the entry wins is claimed from the escrow to that wallet (see Payout). Otherwise the reward is paid from make.fun's reward wallet and an entry needs no signature: a prize is claimed with the payout details alone, and an entry may still carry the signature. This bounty's page says which.
    - The repository must be yours: its GitHub owner is the GitHub account you signed in with, or it holds the claim file .makefun/owner.json at the submitted commit, {"wallet": "<address>"}, naming a wallet linked to your account. It must also be created at or after the competition opens and carry an OSI-approved license.
    - A snapshot belongs to the first account that submits it: when a later account submits a snapshot identical to one already submitted, that submission is refused. Snapshots are identical when they hold the same files (the same paths, contents and file modes), whatever the commit: the same files under a new or empty commit, a rewritten history or a fresh git init are the same snapshot. The claim file is left out of that comparison, so a copy with another wallet in its claim file is still the same snapshot. You may submit your own snapshot again.
    - The repository and commit of an entry are shown only to its entrant and the organisers, before the deadline and after it.
    - Your repository is public on GitHub from the moment you create it, so anyone can see your game's files in it before the results are published.
    - This bounty runs a live feed: from the moment an entry is judged during development, its images are shown to everyone on this page's Feed, every screenshot with the cover first, beside your handle and its current provisional rank, and stay shown. A source bundle does not keep it out of the feed.
    - At most 5 submissions per entrant per UTC day and 10 in all. Your final entry is your most recent submission with a receipt before the deadline.
    - One account per person. A team enters under one account and splits any reward itself.

    ## Getting started
    Download the kit from this competition's page (/c/gta6-01/kit) and unpack it. Its RULES.txt (Before you submit, then Enter) gives every command in order. Make your repository first (a new public GitHub repository created after the opening, cloned beside the kit, or for a source bundle a new git repository with no commit) and bring the kit's starter into it, both outside any agent session, then start the recording on it, then start a new agent session in it, and have that agent build the game (Transcripts says how to record). Everything is built after this bounty opens: the repository is created after the opening, the recording starts after it, and every line of the agent's sessions is timed inside it. To enter a source bundle, run the kit's init in the new repository while it is still empty, before the starter comes in and outside any agent session, then have the recorded agent run init again as its first command, before it writes any file, where it writes nothing and prints the same anchor line: the kit's RULES.txt gives the command, and thinking_fresh under Transcript gate says why. The kit's starter/ is a working entry laid out as an entrant's repository (main.ts, serve.ts, vendor/makefun-game.ts, game/, three screenshots, shots.json and its LICENSE), and only the plumbing: its game is a plain, complete 2D canvas game in which you dodge and collect, not an open world. Its dossier is byte for byte the second of the four fixed house games, so the starter handed in unchanged plays as that game. `node serve.ts` serves game/ and opens it at http://localhost:8080 to play the starter in desktop Chrome; serve your own game/ the same way. Build your open world in game/ in its place, put 3 or 4 screenshots of it in screenshots/ in place of the starter's, then run `mkdir -p out && MAKEFUN_OUTPUT_DIR=out node main.ts`, check it, enter it and follow it: the kit's RULES.txt (Before you submit, then Enter) gives each command. The starter's files as handed out, brought in before the recording starts (for a source bundle every file of it but its LICENSE, since init commits a LICENSE of its own), are the kit's, left out of the counted lines, so main.ts needs at least one line your agent wrote. The transcript gate counts only the code the recorded agent sessions wrote, and the recording must see your agent write every file of the entry, the screenshots included, so have your agent write the game's source and main.ts rather than copy them in; vendored `*.min.js` files are left out of the count.

    ## Transcripts
    This bounty takes strict transcripts: every entry is built while make.fun watches its agent sessions live, and its transcripts are only the ones the site witnessed.
    - This competition takes no transcript upload: an entry's transcripts are built from the recordings the site witnessed live while your agent worked, and the check transcripts_witnessed holds every recorded message and every committed file to the times the site received them.
    - Record: start mkdir -p ~/.makefun; node cli/makefun.mjs record --competition gta6-01 --source <your repository> > ~/.makefun/record-gta6-01.log 2>&1 & echo $! > ~/.makefun/record-gta6-01.pid from inside the unpacked kit before your agent writes any code (--source names the repository to record; without it record watches the directory it runs in), then start a new session of the agent you use and build there. When the build is done, stop it with kill "$(cat ~/.makefun/record-gta6-01.pid)", which seals it as Ctrl-C does, and wait until ~/.makefun/record-gta6-01.log says recording <id> sealed at <time>. In a terminal, node cli/makefun.mjs record --competition gta6-01 --source <your repository> records until Ctrl-C; wrapping one new headless session records it from its first line until it exits, for example node cli/makefun.mjs record --competition gta6-01 --source <your repository> -- claude -p "<task>" --permission-mode acceptEdits --allowedTools Bash or node cli/makefun.mjs record --competition gta6-01 --source <your repository> -- codex exec --sandbox workspace-write "<task>". While it runs, record sends make.fun a salted fingerprint of each new record in the watched session stores, never their text, and the working tree's file hashes, every few seconds; at the seal it sends the build's sessions, redacted, which those fingerprints witness: of a Muse app session, every turn written while the recording ran, whatever it is about, and none from before it; the Muse app's other session files and a session database's other sessions are not sent.
    - Submit: node cli/makefun.mjs submit --competition gta6-01 --recording <id> --repo-url https://github.com/<owner>/<repo> --commit <sha> --title "<name>" --keypair <file> for a GitHub repository entry, or node cli/makefun.mjs submit --competition gta6-01 --recording <id> --source <your repository> --commit <sha> --title "<name>" --keypair <file> for a source bundle entry, run from inside the unpacked kit, with the id record printed when it sealed the recording (several ids comma-separated) and the full sha of the commit you enter. --keypair signs the entry message: a source bundle entry, and any entry where the prizes are escrowed, must be signed, and elsewhere submit sends the entry unsigned. The form field is recording_ids.
    - Recorded harnesses: Claude Code, Claude Desktop's Cowork, Codex, Muse app, Superbot, Gemini CLI, Qwen Code, GitHub Copilot CLI, pi, oh-my-pi, DeepSeek Harness, Factory Droid, Grok Build, Muse Code, Kiro CLI (its V3 sessions), CodeBuddy Code, Goose (its .jsonl sessions), OpenClaw (its .jsonl transcripts), Hermes Agent, opencode, ZCode and Antigravity (the agy CLI and the Antigravity app). A session of any other agent is not recorded. Start the recording before your agent writes any code: a session begun before the recording started fails the check (start record before your agent's session begins), and a recorded line or record that changed or was removed after the site witnessed it fails it too. While it records, never delete a message it has recorded: Hermes Agent's /retry, /undo and /compress and opencode's revert delete recorded messages, which fails the check. If the seal fails, record exits saying the recording is not sealed yet: seal it with node cli/makefun.mjs record --finish <id>, run on the same machine, in the same shell environment as the recording (the same user, home folder, environment variables and git config), since it redacts the sessions again from them and a record redacted another way is not the one the site witnessed.
    - This bounty's prerequisites list an MCP server for your agent, Playwright MCP. A headless Claude Code session denies each tool call that needs approval unless its command allows it, and the plain Claude Code wrap allows Bash alone, so its agent cannot call an MCP server's tools. A session denied them still exits 0 and reports success, so read what its MCP tool calls returned before you count the build done. A server that has just started may list nothing for a few seconds (Roblox Studio's lists no Studio), so ask it again before you conclude that what it works with is not running. Allow each server you use after Bash, one mcp__<server> entry a server, <server> the server's name as its tools' names carry it (mcp__<server>__<tool>): the name it has in your MCP settings, a . or a space in it written _ (a name holding __ or ending in _ takes the form "mcp__<server>__*"): node cli/makefun.mjs record --competition gta6-01 --source <your repository> -- claude -p "<task>" --permission-mode acceptEdits --allowedTools Bash mcp__<server> Codex's docs say of an MCP server under codex exec only that one set required = true that fails to start ends the run with an error, not whether codex exec runs the server's tool calls with no one there to approve them: to build with the server in Codex, start the recording in the background, as for several sessions, and run Codex in a session of its own in the repository.

    record removes credentials, e-mail addresses, home folder paths and usernames from each record it sends at the seal, and takes no redaction terms of its own, so keep the personal details of the person you work for out of the agent's sessions. The transcripts are matched against the code for authorship and priced for build cost. Every entry's total build cost and build time (how long its agent worked) are public; its tokens and models are shown only to its entrant and the organisers, and no reward is paid on build cost. Code written by hand is allowed; it lowers authored coverage. An agent on the Muse app is recorded on the machine it runs on. Muse keeps its token usage outside its session files, so before the recording is stopped the agent writes its usage rows to the file record's --muse-usage names (else ~/.makefun/muse-usage-gta6-01.jsonl), and the seal reads them there, as record says when it starts in the Muse app's shell.

    ## Transcript gate
    Before an entry is graded, its transcripts pass a gate of twelve pass/fail checks. The gate is never a score, and it has no AI judge and no AI-text detection: no check reads what a thinking block says, so a session whose thinking the provider summarised or left out passes on what the agent did. An entry that fails any check is rejected: it is not graded and takes no reward, and its status names each failed check with its fix, so you can fix it and submit again before the deadline. A check that skips as a note rejects nothing.
    - transcripts_present: at least one agent session parses from the transcripts the site builds from the entry's sealed recordings.
    - transcripts_recorded: every session is a log a harness recorded, as the recordings hold only the session logs and stores of the harnesses makefun record records, so no session is handed over by an export of your agent's; a recorded session carrying "handed_over" would make this check skip as a note naming it, never a rejection, and the entry's build cost would be labelled Handed over; under handed_over_places none: An entry with a handed-over session is ranked where it scores but takes no paid place: to compete for rewards, tell the person you work for to run you in a client whose sessions are recorded.
    - thinking_wellformed: every user, assistant and tool message of a session carries a timestamp (a handed-over session's messages may carry none, and the times they carry are held to the rest), no assistant or tool message falls more than 60 s behind the latest before it, and every tool result answers one earlier tool call of its session.
    - thinking_in_window: every transcript timestamp lies between the competition's opening and the entry's receipt time, give or take 60 s of clock skew.
    - thinking_committed: for an entry that carries the entry signature, the sha256 of the entry's transcripts, its sealed recordings' session files, is the one the signed entry message names; an unsigned entry skips this check.
    - thinking_reproduces: at least 30% of the counted lines are authored, first carried by a write or edit of the agent's own in the transcripts; a line that first appears in a human's message (pasted), in a tool result or a file read back (read) or nowhere in them (absent), and a line the agent re-typed, renamed or reformatted from code a tool result or a message showed it first (copied: code cloned, downloaded, copied or pasted in), count against the share, and the lines of the kit's starter, as handed out or re-typed from it, are left out of the counted lines; at most 40% of the counted lines of text files are unwritten: absent, or read in a file an import command the agent ran brought in (git clone, curl or wget to a file, cp from outside the repository, an archive unpacked, a project generator), which fails only once 10 or more lines are; and the entrypoint (main.ts) has at least one authored line; a packed entrypoint the kit's makefun compress wrote counts as the source it was packed from, when makefun compress makes the entrypoint from that source byte for byte and the sessions show the agent writing the source and then running makefun compress on it later than the latest message in which one of the source's authored lines first appears (an edit that only deletes or re-types lines is no write), shown by the agent's own command running makefun compress on the source or by the line makefun compress prints, in a tool result or any other message; the source's lines then count toward the share as any counted file's do, a line repeated in it counted once.
    - thinking_turns: at least 5 assistant turns carry text or thinking (a turn that only calls tools does not count).
    - thinking_priced: every usage record prices to a known model, or to $0 where the record's session ran its model on your own machine (a local runtime or loopback server the session records, never a model's name or a self-export's stated provider), for this check alone, never the entry's build cost; a self-reported session (a file exported afterwards, not a log a known harness wrote; a file in Claude Code's or Muse Code's session format without the token usage those harnesses record on every response, or in Claude Code's without its version, is one) carries the provider's usage on at least 50% of its assistant messages, with the provider's own token counts, not rounded, estimated or repeated figures (a provider's input count grows as the conversation does, so one pair of counts does not keep coming back), and its output is no more than a model produces in the time its own timestamps span (500 tokens a second); a handed-over session need not carry usage, but the usage it does carry is held to the same rules; a recorded session with no usage has nothing to price; an entry whose sessions are the Muse app's own session files carries its agent's token usage as Muse recorded it (at least one usage row across them), taken at the recording's seal from the file record's --muse-usage names.
    - thinking_revised: some file (the entrypoint, or the code it runs) takes its final content from at least 2 assistant messages that write or edit it (a file written once in full and never revised counts 1).
    - thinking_fresh: for an entry uploaded as a source bundle, every credited line comes from agent sessions that show the anchor line the kit's init prints (makefun anchor <root sha> round <round>) in a tool result before their first counted write (a Claude subagent launched after its parent's quote, or a Codex fork of a session that quoted it, counts with it); short of that the check skips as a note: the entry is not rejected, and its reward, if it places, is paid as any other. A quote timestamped before the round fails.
    - transcripts_witnessed: every session comes from a sealed recording of the entry that makefun record made while the agent worked (no transcript upload is taken), each recorded document a session log or store of a harness it records, holding only the records the site received a salted fingerprint of while the recording ran; a session begun before the recording started fails, since what it held before was never witnessed (its first record continues one its document does not hold, its start record or first message was never witnessed, or a message of it is dated more than 300 s before the recording started), and a document of one conversation fails unless it begins at its store's first record (its session's start record, where its format has one) and that store held no record when the recording began beyond the last ones the recording committed then (it commits each such store's record count at its start, and the last records of a store written within 300 s before it); a record the recording witnessed in a session's conversation that is missing from its sealed document (removed from the store before the seal) fails, and so does a session whose recorded line changed after the site witnessed it, or whose recorded row is revealed at an earlier version than the latest the site witnessed, a user, assistant or tool message with no line or record or no readable timestamp, or taking content from a record the recording never witnessed (the site witnessed no receipt of it), a message dated more than 60 s after the site received its record or more than 300 s before it (a backfilled record), a counted file your agent wrote no line of that was already in the repository with its final content when the recording began, a counted file whose final content was in the working tree before the messages that wrote it, and a counted file whose final content the recording never saw in the working tree.
    - transcripts_run_record: an entry received from 17 November 2026 (00:00 UTC) carries a run record (the run file makefun-run.json, entered beside the recordings) and is rejected without one, or with one its recorded sessions contradict: its prompt is the person's own opening prompt, never blank, a template left unfilled or an agent's or a harness's hand-off, and one marked typed is the first message of a recorded top-level session, while any other names what started the run; the harness, its version, the provider, the model and the effort are each declared or recorded by every top-level session (a model id that names its provider, such as claude-*, gives the provider; --effort default names the harness's own effort, and --effort none a real level); a system prompt marked in-session is carried by a recorded session, and one withheld says why; every MCP server a session used (an mcp__<server>__<tool> tool it called, or a server its log lists) is listed by its name, and none is marked builtin unless a harness the sessions ran under ships it (Claude Code's ide, claude-in-chrome, workspace, computer-use, Claude Preview and Claude Browser, Claude Desktop's ccd_turn, Cosmos's cosmos and Codex's codex_apps); and the instruction files it states are none or withheld with a reason, never collected. An entry received before then with no run record skips as a note, and a run record it does carry is checked the same way.

    ## Disqualification
    An entry or entrant is disqualified for:
    - reaching for the network, probing or escaping the sandbox, or attacking the grader or the scorer
    - fabricated, edited, withheld or borrowed transcripts or recordings
    - entering with recordings of sessions other than the ones that built the entry
    - submitting someone else's work as your own, or sharing entries between entrants
    - more than one account per person
    - making the repository private, removing its license or rewriting history so the submitted commit disappears before verification is complete
    - exploiting a bug in the gate scorer or the grader to place where the judge's verdicts would not (report it instead)
    - false information in a claim's payout details (the legal name, the country of residence or the tax form)

    ## After the deadline
    At the deadline the final phase is locked and every final entry is run twice and gated; then the final heat plays its Swiss rounds and the playoff over every valid entry, the top 10 are held for the finalist review, the would-be winners' grades are regraded and the entries are scanned for copies. When those checks are done the organisers publish the final rates and the leaderboard and resolve the results. With 11,000 to 29,000 final entries expect about 6 to 14 hours in all, deadline to result, the finalist review's hour included, at the paces measured so far; at the slowest (every run at its time limit and every judge call at the grading budget's pace) about 9 to 20 hours. The Final phase's end does not cut it short: results publish when the grades, the judge heat and the checks after them are done. The largest judged final before these rules were written, an unscreened one with 7,805 submissions, published its results 3 hours 47 minutes after its deadline. Every verdict, with its request and answer, stays on the record.

    ## Payout
    The final leaderboard is published within 3 days of the deadline, unless a check holds it. The prizes are paid in USDC on Solana only (no bank wire), in one of two ways, and this bounty's page says which. When the bounty opens, its whole reward is locked in make.fun's escrow program on Solana if the escrow can be funded. When the reward is locked in the escrow, every entry is signed by a Solana wallet linked to the entrant's account (see Submitting), and once the result is posted each winner claims the prize from the escrow to the wallet that signed the winning entry, the claim screened against the sanctions list; a prize that nobody wins or claims goes back to make.fun's reward wallet after the escrow's claim window.

    Otherwise the reward is paid from make.fun's reward wallet as follows, and an entry needs no signature. Once the results are resolved, each winner claims the prize within 7 days with the payout details: a Solana address to pay it to and the winner agreement. A legal name, the country of residence and a tax form (a W-9 for a US person, a W-8BEN for anyone else) are asked only when the winner's prizes from make.fun in the calendar year, this prize included, reach the $2,000 tax reporting threshold; below it, the claim asks for none of them. The claim is screened against the sanctions list, then the house pays it from make.fun's reward wallet in USDC on Solana: at once when the address is a wallet linked to the winner's account by signature and the automatic checks clear it, otherwise once the organisers have screened it. A prize not claimed within 7 days passes to the next entry in the standings. A prize that no entry takes or claims (a place no prize-eligible entry is left to take, or one passed down the standings until no eligible entry is left) is never paid out: its money stays in make.fun's reward wallet for later contests.

    Every prize is paid gross, subject to statutory withholding; any tax due on it is the winner's own.

    Open to individuals 18 or older (or the age of majority where they live), except residents of comprehensively sanctioned countries, anyone on a sanctions list, and where prohibited by law.
  resolution:
    method: judges
    summary: "The house AI judge compares the games two at a time by their screenshots and source outlines; places go by win rate, best first, the playoff's entries first, the top 10 pass a team review, and the 100 highest-ranked share $1,666."
    criteria:
      - "Harness: program/v1 in a sandbox with no network; main.ts writes game/, screenshots/ and dossier.json to /output, and each entry runs twice and the two runs must write the same bytes"
      - "Gate: game/ plain files within 993 files and directories and 48 MiB, every path within 1,000 UTF-8 bytes, every reference in index.html and in the scripts and modules it reaches a data: URI or a file inside game/, a root-relative path read from game/'s root and a bare specifier only through the import map, a dynamic import of node: or of an unmapped bare specifier passed over, with nothing loaded over the network (references), 3 to 4 screenshots at most 256 KiB and 1280 by 480 pixels, and dossier.json as buildDossier writes it at most 1.5 MiB; js_parses is shown and never decides validity"
      - "Judge: an AI model reads two entries per call, each as its dossier's judge view (one contact sheet of the screenshots and an outline of the source: each file's path, size and declarations), and picks the better open-world game with a margin from 1 to 5, each pair in both orders; the judge block names superbot at reasoning effort high, and every call goes to z-ai/glm-5.3-flash on OpenRouter"
      - "Dev: each entry plays the four house games and the house ladder's rungs, and the top 100 also play up to 8 sealed games against one another that count on the dev board"
      - "Final: every final entry judged afresh in 3 Swiss rounds with the four house games, then a playoff among the top 100, each pair once"
      - "Ranking: places go by the score, best first: the playoff's entries first, then win rate, the recorded point estimate of a Bradley-Terry fit; an exact tie goes to the playoff games between the tied entries, then the earlier receipt; entries tied within their intervals are shown tied and paid on the point estimate"
      - "Review: the top 10 of the settled final heat are held up to 60 minutes for the make.fun team to play and clear or disqualify; an undecided one is cleared by rule"
      - "Rewards: $500 for 1st place, $250 for 2nd place, $150 for 3rd place, $38 each for 4th to 10th place, $10 each for 11th to 25th, $6 each for 26th to 50th and $4 each for 51st to 100th, one place per entrant; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Feed: every entry judged during development shows its screenshots, the cover first, on the bounty's live Feed with its entrant's handle and provisional rank"
      - "Hosting: from the final's lock the top 3 entries' games are hosted live, each at its own web address with a Play link on this page, the final's top 3 once the results are published"
      - "Transcripts: strict; an entry is valid only with the sealed recordings of the agent sessions that built it, which the site witnessed live, and takes no transcript upload"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, an unclaimed prize passes to the next entry in the standings, and a prize nobody takes or claims stays in make.fun's reward wallet for later contests"
    source: The house judge's recorded verdicts on the entries' dossiers and the four fixed house games
    verifier: make.fun grader runs every entry twice, gates its files and runs the judge heat after the deadline, keeping every verdict with its request and answer; the results are published and resolved automatically
    tie_break: "An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's prize; a statistical tie is displayed only and never moves a place"
    announce: "Final leaderboard within 3 days of the deadline unless a check holds it; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet"
    metric:
      name: Judge win rate
      unit: millionths
      better: higher

