<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Palmera Bay — an open-world crime story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #101018; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; height: 100%; overflow: hidden; width: 100%; }
  #wrap { height: 100vh; position: relative; width: 100vw; }
  #game { display: block; height: 100%; inset: 0; position: absolute; width: 100%; }
  #hud { color: #fff; display: none; inset: 0; pointer-events: none; position: absolute; }
  .panel { background: rgba(8, 10, 18, 0.62); border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; backdrop-filter: blur(2px); }
  #objective { font-size: 15px; font-weight: 600; left: 14px; line-height: 1.35; max-width: 460px; padding: 10px 14px; position: absolute; top: 14px; }
  #objective-title { color: #ffd23f; font-size: 13px; letter-spacing: 0.5px; }
  #objective-step { margin-top: 2px; }
  #objective-timer { color: #9fd8ff; font-size: 13px; font-weight: 800; margin-top: 2px; }
  #top-right { padding: 10px 14px; position: absolute; right: 14px; text-align: right; top: 14px; }
  #money { color: #7dff8a; font-size: 26px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.7); }
  #stars { font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  #clock { color: #ffd23f; font-size: 14px; font-weight: 700; }
  #heat-wrap { background: rgba(0,0,0,0.55); border-radius: 3px; display: none; height: 6px; margin-left: auto; margin-top: 6px; overflow: hidden; width: 190px; }
  #heat-fill { background: linear-gradient(90deg, #f2c230, #e33f2f); height: 100%; transition: width 0.2s; width: 0%; }
  #health-bar { background: rgba(0,0,0,0.55); border-radius: 6px; height: 12px; margin-left: auto; margin-top: 6px; overflow: hidden; width: 190px; }
  #health-fill { background: #58d068; height: 100%; transition: width 0.2s; width: 100%; }
  #health-num { color: #fff; font-size: 12px; }
  #heli-alert { animation: pulse 1s infinite; color: #ff6b6b; display: none; font-size: 12px; font-weight: 800; margin-top: 6px; }
  #bottom-left { bottom: 14px; font-size: 14px; left: 14px; line-height: 1.5; padding: 10px 14px; position: absolute; }
  #speed { font-size: 22px; font-weight: 800; }
  #weapon { color: #ffd23f; font-weight: 700; }
  #radio { color: #9fd8ff; }
  #minimap { background: rgba(8,10,18,0.7); border: 2px solid rgba(255,255,255,0.35); border-radius: 8px; bottom: 14px; height: 138px; position: absolute; right: 14px; width: 190px; }
  #toast { left: 50%; max-width: 640px; opacity: 0; padding: 14px 26px; position: absolute; text-align: center; top: 22%; transform: translateX(-50%) translateY(-8px); transition: opacity 0.25s, transform 0.25s; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast-title { color: #ffd23f; font-size: 24px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
  #toast-body { font-size: 15px; line-height: 1.4; margin-top: 4px; }
  #race-status { color: #ffd23f; display: none; font-size: 15px; font-weight: 800; left: 50%; letter-spacing: 0.5px; padding: 8px 18px; position: absolute; top: 14px; transform: translateX(-50%); }
  #menu { align-items: center; background: linear-gradient(160deg, rgba(20,8,32,0.82), rgba(120,40,10,0.78)); color: #fff; display: flex; inset: 0; justify-content: center; position: absolute; z-index: 10; }
  #menu-card { background: rgba(10,10,20,0.55); border: 1px solid rgba(255,210,63,0.4); border-radius: 16px; max-width: 680px; padding: 36px 44px; text-align: center; }
  #menu-title { color: #ffd23f; font-size: 54px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 24px rgba(255,140,40,0.8), 0 4px 0 rgba(0,0,0,0.5); }
  #menu-body { color: #f2ead8; font-size: 16px; line-height: 1.6; margin: 16px 0; }
  #menu-body .tag { color: #9fd8ff; font-style: italic; }
  #menu-hint { animation: pulse 1.4s infinite; color: #7dff8a; font-size: 17px; font-weight: 700; }
  #fps { bottom: 150px; color: rgba(255,255,255,0.5); font-size: 11px; left: 14px; position: absolute; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="hud">
    <div id="objective" class="panel"><div id="objective-title">◆ PALMERA BAY</div><div id="objective-step">Press M for the next job.</div><div id="objective-timer"></div></div>
    <div id="top-right" class="panel">
      <div id="money">$250</div>
      <div id="stars">☆☆☆☆☆</div>
      <div id="heat-wrap"><div id="heat-fill"></div></div>
      <div id="heli-alert"></div>
      <div id="clock">17:00</div>
      <div id="health-bar"><div id="health-fill"></div></div>
      <div id="health-num">100 HP</div>
    </div>
    <div id="bottom-left" class="panel">
      <div id="speed">On foot</div>
      <div id="weapon">Fists</div>
      <div id="radio">♪ PALMERA FM</div>
    </div>
    <canvas id="minimap" width="190" height="138"></canvas>
    <div id="toast" class="panel"><div id="toast-title"></div><div id="toast-body"></div></div>
    <div id="race-status" class="panel"></div>
    <div id="fps"></div>
  </div>
  <div id="menu">
    <div id="menu-card">
      <div id="menu-title">PALMERA BAY</div>
      <div id="menu-body"></div>
      <div id="menu-hint"></div>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
