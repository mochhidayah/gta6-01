<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Palmera Bay — an open-world crime story</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #101018; font-family: 'Segoe UI', system-ui, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #game { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #hud { position: absolute; inset: 0; display: none; color: #fff; pointer-events: none; }
  .panel { background: rgba(8, 10, 18, 0.62); border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; backdrop-filter: blur(2px); }
  #objective { position: absolute; top: 14px; left: 14px; max-width: 460px; padding: 10px 14px; font-size: 15px; font-weight: 600; line-height: 1.35; }
  #objective-title { color: #ffd23f; font-size: 13px; letter-spacing: 0.5px; }
  #objective-step { margin-top: 2px; }
  #objective-timer { margin-top: 2px; font-size: 13px; color: #9fd8ff; font-weight: 800; }
  #heat-wrap { width: 190px; height: 6px; margin-top: 6px; margin-left: auto; overflow: hidden; background: rgba(0,0,0,0.55); border-radius: 3px; display: none; }
  #heat-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #f2c230, #e33f2f); transition: width 0.2s; }
  #heli-alert { margin-top: 6px; font-size: 12px; font-weight: 800; color: #ff6b6b; display: none; animation: pulse 1s infinite; }
  #top-right { position: absolute; top: 14px; right: 14px; padding: 10px 14px; text-align: right; }
  #money { font-size: 26px; font-weight: 800; color: #7dff8a; text-shadow: 0 2px 4px rgba(0,0,0,0.7); }
  #stars { font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  #clock { font-size: 14px; font-weight: 700; color: #ffd23f; }
  #health-bar { width: 190px; height: 12px; margin-top: 6px; margin-left: auto; overflow: hidden; background: rgba(0,0,0,0.55); border-radius: 6px; }
  #health-fill { width: 100%; height: 100%; background: #58d068; transition: width 0.2s; }
  #health-num { font-size: 12px; color: #fff; }
  #bottom-left { position: absolute; left: 14px; bottom: 14px; padding: 10px 14px; font-size: 14px; line-height: 1.5; }
  #speed { font-size: 22px; font-weight: 800; }
  #weapon { font-weight: 700; color: #ffd23f; }
  #radio { color: #9fd8ff; }
  #minimap { position: absolute; right: 14px; bottom: 14px; width: 190px; height: 138px; background: rgba(8,10,18,0.7); border: 2px solid rgba(255,255,255,0.35); border-radius: 8px; }
  #toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%) translateY(-8px); max-width: 640px; padding: 14px 26px; text-align: center; opacity: 0; transition: opacity 0.25s, transform 0.25s; }
  #race-status { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 8px 18px; font-size: 15px; font-weight: 800; color: #ffd23f; display: none; letter-spacing: 0.5px; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast-title { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #ffd23f; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
  #toast-body { margin-top: 4px; font-size: 15px; line-height: 1.4; }
  #menu { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(20,8,32,0.82), rgba(120,40,10,0.78)); color: #fff; }
  #menu-card { max-width: 680px; padding: 36px 44px; text-align: center; background: rgba(10,10,20,0.55); border: 1px solid rgba(255,210,63,0.4); border-radius: 16px; }
  #menu-title { font-size: 54px; font-weight: 900; letter-spacing: 3px; color: #ffd23f; text-shadow: 0 0 24px rgba(255,140,40,0.8), 0 4px 0 rgba(0,0,0,0.5); }
  #menu-body { margin: 16px 0; font-size: 16px; line-height: 1.6; color: #f2ead8; }
  #menu-body .tag { color: #9fd8ff; font-style: italic; }
  #menu-hint { font-size: 17px; font-weight: 700; color: #7dff8a; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  #fps { position: absolute; left: 14px; bottom: 150px; font-size: 11px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="hud">
    <div id="objective" class="panel"><div id="objective-title">◆ PALMERA BAY</div><div id="objective-step">Press M for the next job.</div><div id="objective-timer"></div></div>
    <div id="top-right" class="panel">
      <div id="money">$250</div>
      <div id="stars">☆☆☆☆☆</div>
      <div id="heat-wrap"><div id="heat-fill"></div></div>
      <div id="heli-alert"></div>
      <div id="clock">17:00</div>
      <div id="health-bar"><div id="health-fill"></div></div>
      <div id="health-num">100 HP</div>
    </div>
    <div id="bottom-left" class="panel">
      <div id="speed">On foot</div>
      <div id="weapon">Fists</div>
      <div id="radio">♪ PALMERA FM</div>
    </div>
    <canvas id="minimap" width="190" height="138"></canvas>
    <div id="toast" class="panel"><div id="toast-title"></div><div id="toast-body"></div></div>
    <div id="race-status" class="panel"></div>
    <div id="fps"></div>
  </div>
  <div id="menu">
    <div id="menu-card">
      <div id="menu-title">PALMERA BAY</div>
      <div id="menu-body"></div>
      <div id="menu-hint"></div>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
